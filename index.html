<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Iraqi E-Commerce Store</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .product-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    .cart-section { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 20px; }
    button { background: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
    input, select { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
  </style>
</head>
<body>

  <h1>المتجر الإلكتروني</h1>
  
  <h2>المنتجات</h2>
  <div id="product-list">جاري تحميل المنتجات...</div>

  <div class="cart-section">
    <h2>السلة وإتمام الطلب</h2>
    <div id="cart-items">السلة فارغة</div>
    <hr>
    <h3>بيانات الزبون</h3>
    <label>الاسم الكامل:</label>
    <input type="text" id="cust-name" placeholder="على كريم">

    <label>رقم الهاتف:</label>
    <input type="text" id="cust-phone" placeholder="07701234567">

    <label>المحافظة:</label>
    <select id="cust-gov">
      <option value="Baghdad">بغداد</option>
      <option value="Basra">البصرة</option>
      <option value="Erbil">أربيل</option>
      <option value="Najaf">النجف</option>
    </select>

    <label>العنوان التفصيلي:</label>
    <input type="text" id="cust-address" placeholder="المنصور - شارع 14">

    <label>طريقة الدفع:</label>
    <select id="pay-method">
      <option value="Cash On Delivery">الدفع عند الاستلام (COD)</option>
      <option value="ZainCash">زين كاش (ZainCash)</option>
      <option value="QiCard">كي کارت (QiCard)</option>
    </select>

    <button onclick="submitOrder()">إرسال الطلب الآن</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwmwbcGsHTncwFeo9cjdzLyR-snXsRko9QoHA6riCCKV2THkMXpdnb0h3p5pXhpdxDN/exec";
    let cart = [];

    // 1. Fetch Products from Google Sheets on Page Load
    async function loadProducts() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        const listDiv = document.getElementById('product-list');
        listDiv.innerHTML = '';

        if (data.products && data.products.length > 0) {
          data.products.forEach(p => {
            listDiv.innerHTML += `
              <div class="product-card">
                <h3>${p.name_ar} (${p.name_en})</h3>
                <p>السعر: ${p.price} د.ع</p>
                <button onclick="addToCart('${p.id}', '${p.name_ar}', ${p.price})">إضافة إلى السلة</button>
              </div>
            `;
          });
        } else {
          listDiv.innerHTML = 'لا توجد منتجات حالياً';
        }
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    // 2. Add Item to Cart
    function addToCart(id, name, price) {
      const existing = cart.find(item => item.product_id === id);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ product_id: id, name_ar: name, price: price, quantity: 1 });
      }
      renderCart();
    }

    // 3. Render Cart
    function renderCart() {
      const cartDiv = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartDiv.innerHTML = 'السلة فارغة';
        return;
      }
      cartDiv.innerHTML = cart.map(i => `<p>${i.name_ar} × ${i.quantity} = ${i.price * i.quantity} د.ع</p>`).join('');
    }

    // 4. Submit Order to Google Apps Script
    async function submitOrder() {
      if (cart.length === 0) return alert("الرجاء إضافة منتجات للسلة أولاً");

      const payload = {
        action: "create_order",
        customer_name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        governorate: document.getElementById('cust-gov').value,
        district_address: document.getElementById('cust-address').value,
        payment_method: document.getElementById('pay-method').value,
        items: cart.map(i => ({ product_id: i.product_id, quantity: i.quantity }))
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "success") {
          alert("تم إرسال طلبك بنجاح! رقم الطلب: " + result.orderId);
          cart = [];
          renderCart();
        } else {
          alert("حدث خطأ أثناء إرسال الطلب");
        }
      } catch (err) {
        console.error("Error submitting order:", err);
      }
    }

    loadProducts();
  </script>
</body>
</html>
