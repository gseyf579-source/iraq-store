<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-12">

    <!-- هيدر المتجر -->
    <header class="bg-white shadow-md sticky top-0 z-50 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-green-700"><i class="fa-solid fa-store"></i> متجري الإلكتروني</h1>
        <button onclick="openCheckoutModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg shadow font-bold text-sm">
            <i class="fa-solid fa-cart-shopping"></i> إتمام الطلب (<span id="cartCount">0</span>)
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <!-- شريط التصنيفات -->
        <div class="mb-6">
            <h2 class="text-lg font-bold mb-2 text-gray-800">التصنيفات</h2>
            <div id="categoriesContainer" class="flex gap-2 overflow-x-auto pb-2"></div>
        </div>

        <!-- عرض المنتجات -->
        <h2 class="text-2xl font-bold mb-4 text-gray-800">المنتجات المتوفرة</h2>
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <p class="col-span-full text-center text-gray-500 py-10">جاري تحميل المنتجات...</p>
        </div>

        <!-- أزرار التنقل بين الصفحات -->
        <div id="paginationContainer" class="flex justify-center items-center gap-2 mt-8"></div>
    </main>

    <!-- نافذة إتمام الطلب -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeCheckoutModal()" class="absolute top-4 left-4 text-gray-500 hover:text-black text-2xl font-bold">&times;</button>
            
            <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">إتمام الطلب</h3>
            
            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="mb-3 bg-gray-50 p-3 rounded-lg border">
                    <label class="block text-xs font-bold text-green-800 mb-1">1. معلومات الزبون:</label>
                    <input type="text" id="customerName" required placeholder="الاسم الكامل" class="w-full border rounded-lg p-2 text-sm mb-2 bg-white">
                    <input type="tel" id="customerPhone" required placeholder="رقم الهاتف" class="w-full border rounded-lg p-2 text-sm bg-white">
                </div>

                <div class="mb-3 bg-gray-50 p-3 rounded-lg border">
                    <label class="block text-xs font-bold text-green-800 mb-1">2. عنوان الشحن:</label>
                    <select id="governorateSelect" required class="w-full border rounded-lg p-2 text-sm mb-2 bg-white" onchange="updateTotal()">
                        <option value="">اختر المحافظة...</option>
                    </select>
                    <textarea id="customerAddress" required rows="2" placeholder="العنوان بالتفصيل" class="w-full border rounded-lg p-2 text-sm bg-white"></textarea>
                </div>

                <div class="mb-3 bg-gray-50 p-3 rounded-lg border">
                    <label class="block text-xs font-bold text-green-800 mb-1">3. طريقة الدفع:</label>
                    <select id="paymentMethod" onchange="togglePaymentDetails()" class="w-full border rounded-lg p-2 text-sm bg-white">
                        <option value="الدفع عند الاستلام">الدفع عند الاستلام</option>
                        <option value="زين كاش (ZainCash)">زين كاش (ZainCash)</option>
                        <option value="كي كارت (QiCard)">كي كارت (QiCard)</option>
                    </select>

                    <div id="paymentDetailsDiv" class="mt-2 hidden">
                        <p id="storeAccountInfo" class="text-xs font-bold text-blue-700 bg-blue-50 p-2 rounded border border-blue-200 mb-2"></p>
                    </div>
                </div>

                <div class="border-t pt-3 mb-4 bg-gray-50 p-3 rounded-lg">
                    <div class="flex justify-between font-bold text-base text-gray-800">
                        <span>الإجمالي الكلي:</span>
                        <span id="totalPrice" class="text-green-600">0 د.ع</span>
                    </div>
                </div>

                <button type="submit" id="submitOrderBtn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition text-sm">
                    تأكيد وإرسال الطلب
                </button>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5WhfnkEt8LoFlx7P15O4pRnCtO8Dwm-nriqK2R03WnsidMplWTLmsdpuFd0_tjDFA/exec"; // استبدل برابط الـ Web App الفعلي
        const BUSINESS_WHATSAPP = "9647782292062"; // رقم واتساب الأعمال الخاص بك

        let allProducts = [];
        let filteredProducts = [];
        let deliveryZonesData = [];
        let cart = [];
        let currentPage = 1;
        const itemsPerPage = 8;
        let currentCategory = "الكل";

        window.onload = function() {
            loadProducts();
            loadGovernorates();
        };

        function loadProducts() {
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        allProducts = data.products;
                        filteredProducts = allProducts;
                        setupCategories();
                        renderProducts();
                        renderPagination();
                    }
                })
                .catch(err => console.error("Error loading products:", err));
        }

        function loadGovernorates() {
            fetch(WEB_APP_URL + "?action=zones")
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        deliveryZonesData = data.zones;
                        const select = document.getElementById('governorateSelect');
                        select.innerHTML = '<option value="">اختر المحافظة...</option>';
                        deliveryZonesData.forEach(zone => {
                            select.innerHTML += `<option value="${zone.name}" data-price="${zone.price}">${zone.name} (${zone.price} د.ع)</option>`;
                        });
                    }
                })
                .catch(err => console.error("Error loading zones:", err));
        }

        function setupCategories() {
            const categoriesSet = new Set(allProducts.map(p => p.category).filter(Boolean));
            const container = document.getElementById('categoriesContainer');
            
            let allActive = currentCategory === "الكل" ? "bg-green-600 text-white" : "bg-white text-gray-700 border hover:bg-gray-100";
            container.innerHTML = `<button onclick="filterCategory('الكل')" class="category-btn ${allActive} px-4 py-2 rounded-full text-sm font-bold shadow whitespace-nowrap transition">الكل</button>`;
            
            categoriesSet.forEach(cat => {
                let isActive = currentCategory === cat;
                let btnClass = isActive ? "bg-green-600 text-white" : "bg-white text-gray-700 border hover:bg-gray-100";
                container.innerHTML += `<button onclick="filterCategory('${cat}')" class="category-btn ${btnClass} px-4 py-2 rounded-full text-sm font-bold shadow-sm whitespace-nowrap transition">${cat}</button>`;
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            currentPage = 1;
            
            if (category === "الكل") {
                filteredProducts = allProducts;
            } else {
                filteredProducts = allProducts.filter(p => p.category === category);
            }

            setupCategories();
            renderProducts();
            renderPagination();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = "";

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">لا توجد منتجات متوفرة حالياً</p>`;
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredProducts.slice(start, end);

            pageItems.forEach(p => {
                let stockNum = parseInt(p.stock) || 0;
                let isOutOfStock = stockNum <= 0;
                
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow p-3 flex flex-col justify-between border ${isOutOfStock ? 'opacity-60' : ''}">
                        <img src="${p.imageUrl}" alt="${p.nameAr}" class="w-full h-36 object-cover rounded-lg mb-2" onerror="this.src='https://via.placeholder.com/150?text=Image+Error'">
                        <h3 class="font-bold text-gray-800 text-xs mb-1 truncate">${p.nameAr}</h3>
                        <p class="text-green-600 font-bold text-xs mb-1">${p.price} د.ع</p>
                        <p class="text-xs text-gray-500 mb-2">المتوفر: ${stockNum}</p>
                        <button onclick="addToCart('${p.id}', '${p.nameAr}', ${p.price}, ${stockNum})" 
                            class="${isOutOfStock ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'} text-white text-xs py-2 rounded-lg font-bold transition">
                            ${isOutOfStock ? 'نفذت الكمية' : 'إضافة للسلة'}
                        </button>
                    </div>
                `;
            });
        }

        function renderPagination() {
            const container = document.getElementById('paginationContainer');
            container.innerHTML = "";

            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? "bg-green-600 text-white" : "bg-white text-gray-700 border hover:bg-gray-100";
                container.innerHTML += `
                    <button onclick="changePage(${i})" class="w-9 h-9 rounded-lg font-bold text-sm shadow-sm transition ${activeClass}">
                        ${i}
                    </button>
                `;
            }
        }

        function changePage(page) {
            currentPage = page;
            renderProducts();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addToCart(id, name, price, stock) {
            if (stock <= 0) {
                alert("عذراً، هذا المنتج نفذ من المخزون ولا يمكن إضافته للسلة!");
                return;
            }

            let existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.qty >= stock) {
                    alert("لقد وصلت إلى الحد الأقصى المتوفر في المخزون لهذا المنتج!");
                    return;
                }
                existing.qty++;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            
            document.getElementById('cartCount').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            alert("تمت الإضافة إلى السلة بنجاح!");
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert("السلة فارغة حالياً!");
                return;
            }
            document.getElementById('checkoutModal').classList.remove('hidden');
            updateTotal();
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function togglePaymentDetails() {
            let method = document.getElementById('paymentMethod').value;
            let div = document.getElementById('paymentDetailsDiv');
            let infoBox = document.getElementById('storeAccountInfo');
            
            if (method === "زين كاش (ZainCash)") {
                div.classList.remove('hidden');
                infoBox.innerHTML = "تحويل المبلغ إلى محفظة زين كاش الخاصة بالمتجر:<br><b>078XXXXXXXX</b> (رقم محفظة زين كاش الخاص بالمتجر)";
            } else if (method === "كي كارت (QiCard)") {
                div.classList.remove('hidden');
                infoBox.innerHTML = "تحويل المبلغ إلى حساب كي كارت الخاص بالمتجر:<br><b>xxxx-xxxx-xxxx-xxxx</b> (رقم حساب كي كارت الخاص بالمتجر)";
            } else {
                div.classList.add('hidden');
            }
        }

        function updateTotal() {
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let select = document.getElementById('governorateSelect');
            let selectedOption = select.options[select.selectedIndex];
            let deliveryFee = selectedOption && selectedOption.getAttribute('data-price') ? parseFloat(selectedOption.getAttribute('data-price')) : 0;
            
            let total = subtotal + deliveryFee;
            document.getElementById('totalPrice').innerText = total + " د.ع";
        }

        function submitOrder(e) {
            e.preventDefault();
            
            let submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري إرسال الطلب...";
            submitBtn.className = "w-full bg-gray-400 text-white py-3 rounded-lg font-bold shadow cursor-not-allowed text-sm";
            
            let customerName = document.getElementById('customerName').value;
            let customerPhone = document.getElementById('customerPhone').value;
            let governorate = document.getElementById('governorateSelect').value;
            let address = document.getElementById('customerAddress').value;
            let paymentMethod = document.getElementById('paymentMethod').value;
            
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let select = document.getElementById('governorateSelect');
            let selectedOption = select.options[select.selectedIndex];
            let deliveryFee = selectedOption && selectedOption.getAttribute('data-price') ? parseFloat(selectedOption.getAttribute('data-price')) : 0;
            let totalPrice = subtotal + deliveryFee;

            let orderData = {
                action: "order",
                customerName: customerName,
                customerPhone: customerPhone,
                governorate: governorate,
                address: address,
                paymentMethod: paymentMethod,
                deliveryFee: deliveryFee,
                totalPrice: totalPrice,
                cart: cart
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    let orderNum = data.orderId;
                    alert("تم إرسال طلبك وحفظه بنجاح برقم: " + orderNum);
                    
                    // تجهيز نص رسالة الواتساب
                    let cartItemsList = cart.map(item => `- ${item.name} (عدد ${item.qty}) = ${item.price * item.qty} د.ع`).join('\n');
                    let message = `📦 *طلب جديد رقم #${orderNum}*\n\n` +
                                  `👤 *الاسم:* ${customerName}\n` +
                                  `📞 *الهاتف:* ${customerPhone}\n` +
                                  `📍 *المحافظة:* ${governorate}\n` +
                                  `🏠 *العنوان:* ${address}\n` +
                                  `💳 *طريقة الدفع:* ${paymentMethod}\n\n` +
                                  `🛒 *المنتجات:*\n${cartItemsList}\n\n` +
                                  `🚚 *أجور التوصيل:* ${deliveryFee} د.ع\n` +
                                  `💰 *المجموع الكلي:* ${totalPrice} د.ع`;
                    
                    // فتح رابط المراسلة الشامل للتكيف مع رقمك الشخصي
                    let waUrl = "https://wa.me/" + BUSINESS_WHATSAPP + "?text=" + encodeURIComponent(message);
                    window.location.href = waUrl; // فتح التطبيق مباشرة على الهاتف

                    cart = [];
                    document.getElementById('cartCount').innerText = "0";
                    closeCheckoutModal();
                    document.getElementById('orderForm').reset();
                    loadProducts(); // إعادة جلب المنتجات لتحديث أرقام المخزون في الصفحة
                } else {
                    alert("حدث خطأ أثناء حفظ الطلب: " + data.message);
                }
                
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد وإرسال الطلب";
                submitBtn.className = "w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition text-sm";
            })
            .catch(err => {
                console.error("Order error:", err);
                alert("حدث خطأ في الاتصال بالخادم.");
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد وإرسال الطلب";
                submitBtn.className = "w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition text-sm";
            });
        }
    </script>
</body>
</html>
