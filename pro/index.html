<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني - Pro Edition</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; padding-bottom: 90px; }
        
        .demo-banner {
            background-color: #ff9800;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .search-container {
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: #27ae60;
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.2);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-title { font-size: 16px; font-weight: bold; margin: 10px 0 5px; color: #333; }
        .product-price { color: #27ae60; font-weight: bold; margin-bottom: 5px; }
        .product-stock { color: #7f8c8d; font-size: 12px; margin-bottom: 10px; }

        .add-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:active { transform: scale(0.98); }

        /* شريط السلة العائم */
        .floating-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        .checkout-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* نافذة إتمام الطلب (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .submit-order-btn { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background-color: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* تنبيه الإضافة السريع */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: fixed;
            z-index: 1001;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 1.5s; }

        @keyframes fadein { from {bottom: 50px; opacity: 0;} to {bottom: 80px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 80px; opacity: 1;} to {bottom: 50px; opacity: 0;} }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #fff;
            border: 1px solid #27ae60;
            color: #27ae60;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .page-btn.active {
            background: #27ae60;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="demo-banner">
        📢 هذا المتجر عبارة عن نموذج تجريبي (Pro Edition) للنظام السحابي! هل تريد متجراً مثله؟ تواصل معنا الآن.
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن منتج..." onkeyup="handleSearch()">
    </div>

    <div class="products-grid" id="productsContainer">
        <p style="text-align:center; grid-column: 1/-1; padding: 20px; color: #666;">جاري تحميل المنتجات...</p>
    </div>

    <div class="pagination-container" id="paginationContainer"></div>

    <!-- شريط السلة العائم -->
    <div class="floating-cart" id="floatingCart" style="display: none;">
        <div>🛒 السلة: <span id="cartCount">0</span> منتج</div>
        <button class="checkout-btn" onclick="openCheckoutModal()">إتمام الطلب</button>
    </div>

    <!-- نافذة إتمام الطلب وإدخال البيانات -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3>📝 معلومات الزبون لإتمام الطلب</h3>
            <div class="form-group">
                <label>اسم الزبون:</label>
                <input type="text" id="custName" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>المحافظة / المنطقة:</label>
                <input type="text" id="custAddress" placeholder="مثال: بغداد - الكرادة">
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="custPhone" placeholder="07xxxxxxxxx">
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeCheckoutModal()">إلغاء</button>
                <button class="submit-order-btn" onclick="sendOrderWhatsApp()">تأكيد وإرسال للواتساب</button>
            </div>
        </div>
    </div>

    <!-- تنبيه الإضافة السريع -->
    <div id="toast">تمت إضافة المنتج إلى السلة</div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz5WhfnkEt8LoFlx7P15O4pRnCtO8Dwm-nriqK2R03WnsidMplWTLmsdpuFd0_tjDFA/exec';
        
        // ضع رقم هاتف التاجر هنا (مثلاً: 9647800000000+)
        const merchantPhone = '9647700000000'; 

        let allProducts = [];
        let filteredProducts = [];
        let cart = [];
        let currentPage = 1;
        const itemsPerPage = 8;

        async function fetchProducts() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allProducts = data;
                } else if (data.data && Array.isArray(data.data)) {
                    allProducts = data.data;
                } else {
                    allProducts = [];
                }

                filteredProducts = [...allProducts];
                renderStore();
            } catch (error) {
                console.error('خطأ في جلب البيانات:', error);
                document.getElementById('productsContainer').innerHTML = `
                    <div style="text-align:center; grid-column: 1/-1; padding: 20px; color: #c0392b;">
                        <p>⚠️ تعذر تحميل المنتجات.</p>
                    </div>`;
            }
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            filteredProducts = allProducts.filter(product => {
                const nameAr = (product.name_ar || product.Name_AR || '').toString().toLowerCase();
                const nameEn = (product.name_en || product.Name_EN || '').toString().toLowerCase();
                return nameAr.includes(searchTerm) || nameEn.includes(searchTerm);
            });
            
            currentPage = 1;
            renderStore();
        }

        function renderStore() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (filteredProducts.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 20px; color: #666;">لا توجد منتجات مطابقة للبحث.</p>';
                document.getElementById('paginationContainer').innerHTML = '';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredProducts.slice(startIndex, endIndex);

            pageItems.forEach(product => {
                const pName = product.name_ar || product.Name_AR || product.name_en || product.Name_EN || 'منتج';
                const pPrice = product.price_iqd || product.Price_IQD || '0';
                const pStock = product.stock_qty || product.Stock_Qty || '0';
                const pImage = product.image_url || product.Image_URL || '';

                container.innerHTML += `
                    <div class="product-card">
                        <img src="${pImage}" alt="${pName}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        <div>
                            <div class="product-title">${pName}</div>
                            <div class="product-price">${pPrice} د.ع</div>
                            <div class="product-stock">المتوفر: ${pStock}</div>
                        </div>
                        <button class="add-btn" onclick="addToCart('${pName}')">إضافة للسلة</button>
                    </div>
                `;
            });

            renderPagination();
        }

        function addToCart(productName) {
            cart.push(productName);
            document.getElementById('cartCount').innerText = cart.length;
            document.getElementById('floatingCart').style.display = 'flex';

            const toast = document.getElementById('toast');
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
        }

        function openCheckoutModal() {
            if (cart.length === 0) return;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function sendOrderWhatsApp() {
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const phone = document.getElementById('custPhone').value.trim();

            if (!name || !address || !phone) {
                alert('يرجى ملء جميع حقول الاسم والعنوان والهاتف!');
                return;
            }

            let message = `🛒 *طلب جديد من المتجر السحابي*\n\n`;
            message += `👤 *الاسم:* ${name}\n`;
            message += `📍 *العنوان:* ${address}\n`;
            message += `📱 *الهاتف:* ${phone}\n\n`;
            message += `📦 *المنتجات المطلوبة:*\n`;
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item}\n`;
            });

            const whatsappURL = `https://wa.me/${merchantPhone}?text=` + encodeURIComponent(message);
            window.open(whatsappURL, '_blank');
            closeCheckoutModal();
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                button.innerText = i;
                button.onclick = () => {
                    currentPage = i;
                    renderStore();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationContainer.appendChild(button);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
