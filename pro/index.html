<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <!-- Tailwind CSS للتصميم السريع والجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- هيدر المتجر -->
    <header class="bg-white shadow-md sticky top-0 z-50 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-green-700"><i class="fa-solid fa-store"></i> متجري الإلكتروني</h1>
        <button onclick="openCheckoutModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg shadow font-bold">
            <i class="fa-solid fa-cart-shopping"></i> إتمام الطلب (<span id="cartCount">0</span>)
        </button>
    </header>

    <!-- قسم عرض المنتجات -->
    <main class="max-w-6xl mx-auto p-4">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">المنتجات المتوفرة</h2>
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- سيتم تعبئة المنتجات تلقائياً عبر الجافاسكريبت -->
            <p class="col-span-full text-center text-gray-500 py-10">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <!-- نافذة إتمام الطلب (Checkout Modal) -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeCheckoutModal()" class="absolute top-4 left-4 text-gray-500 hover:text-black text-xl font-bold">&times;</button>
            
            <h3 class="text-xl font-bold mb-4 text-gray-800">إتمام الطلب</h3>
            
            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">الاسم الكامل:</label>
                    <input type="text" id="customerName" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">رقم الهاتف:</label>
                    <input type="tel" id="customerPhone" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">اختر المحافظة:</label>
                    <!-- قائمة المحافظات التي ستجلب البيانات تلقائياً من Google Sheets -->
                    <select id="governorateSelect" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-green-500" onchange="updateTotal()">
                        <option value="">جاري تحميل المحافظات...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">العنوان بالتفصيل:</label>
                    <textarea id="customerAddress" required rows="2" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-green-500"></textarea>
                </div>

                <div class="border-t pt-3 mb-4">
                    <div class="flex justify-between font-bold text-lg">
                        <span>الإجمالي الكلي:</span>
                        <span id="totalPrice">0 د.ع</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition">
                    تأكيد وإرسال الطلب
                </button>
            </form>
        </div>
    </div>

    <!-- جافاسكريبت المتجر -->
    <script>
        // ⚠️ ضع رابط الـ Web App الخاص بـ Google Apps Script هنا حصراً:
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5WhfnkEt8LoFlx7P15O4pRnCtO8Dwm-nriqK2R03WnsidMplWTLmsdpuFd0_tjDFA/exec";

        let cart = [];
        let deliveryZonesData = [];

        // عند تحميل الصفحة، جلب المنتجات والمحافظات
        window.onload = function() {
            loadProducts();
            loadGovernorates();
        };

        // 1. جلب المنتجات وعرضها
        function loadProducts() {
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        const grid = document.getElementById('productsGrid');
                        grid.innerHTML = "";
                        
                        data.products.forEach(p => {
                            grid.innerHTML += `
                                <div class="bg-white rounded-xl shadow p-3 flex flex-col justify-between">
                                    <img src="${p.imageUrl}" alt="${p.nameAr}" class="w-full h-40 object-cover rounded-lg mb-2" onerror="this.src='https://via.placeholder.com/150?text=Image+Error'">
                                    <h3 class="font-bold text-gray-800 text-sm mb-1">${p.nameAr}</h3>
                                    <p class="text-green-600 font-bold text-sm mb-2">${p.price} د.ع</p>
                                    <button onclick="addToCart('${p.id}', '${p.nameAr}', ${p.price})" class="bg-green-600 text-white text-xs py-2 rounded-lg font-bold hover:bg-green-700 transition">
                                        إضافة للسلة
                                    </button>
                                </div>
                            `;
                        });
                    }
                })
                .catch(err => console.error("Error loading products:", err));
        }

        // 2. جلب المحافظات وأسعار التوصيل من جدول Delivery_Zones[cite: 4]
        function loadGovernorates() {
            fetch(WEB_APP_URL + "?action=zones")
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        deliveryZonesData = data.zones;
                        const select = document.getElementById('governorateSelect');
                        select.innerHTML = '<option value="">اختر المحافظة...</option>';
                        
                        deliveryZonesData.forEach(zone => {
                            select.innerHTML += `<option value="${zone.name}" data-price="${zone.price}">${zone.name} (${zone.price} د.ع)</option>`;
                        });
                    }
                })
                .catch(err => console.error("Error loading zones:", err));
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            document.getElementById('cartCount').innerText = cart.length;
            alert("تمت الإضافة إلى السلة بنجاح!");
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert("السلة فارغة حالياً!");
                return;
            }
            document.getElementById('checkoutModal').classList.remove('hidden');
            updateTotal();
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function updateTotal() {
            let subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            let select = document.getElementById('governorateSelect');
            let selectedOption = select.options[select.selectedIndex];
            let deliveryFee = selectedOption && selectedOption.getAttribute('data-price') ? parseFloat(selectedOption.getAttribute('data-price')) : 0;
            
            let total = subtotal + deliveryFee;
            document.getElementById('totalPrice').innerText = total + " د.ع";
        }

        function submitOrder(e) {
            e.preventDefault();
            alert("تم إرسال طلبك بنجاح! شكراً لك.");
            cart = [];
            document.getElementById('cartCount').innerText = "0";
            closeCheckoutModal();
        }
    </script>
</body>
</html>
